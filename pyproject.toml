[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-readiness-platform"
version = "0.1.0"
description = "A public-data platform for emergency logistics decision support."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3,<2",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[project.scripts]
ingest-nws-alerts = "decision_readiness.pipelines.ingest_nws_alerts:main"
build-decision-readiness = "decision_readiness.pipelines.build_mvp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
